{% extends "base.html" %}

{% block content %}
<h2>Edit Aset</h2>
<form action="{{ url_for('edit_aset', id=aset[0]) }}" method="POST" enctype="multipart/form-data">
    

    <div class="form-group">
        <label for="asset_name">Nama Aset:</label>
        <input type="text" class="form-control" id="asset_name" name="asset_name" value="{{ aset[1] }}" required>
    </div>

    <div class="form-group">
        <label for="description">Deskripsi:</label>
        <input type="text" class="form-control" id="description" name="description" value="{{ aset[2] }}" required>
    </div>

    <div class="form-group">
        <label for="owner">Owner:</label>
        <input type="text" class="form-control" id="owner" name="owner" value="{{ aset[3] }}" required>
    </div>

    <div class="form-group">
        <label for="category">Kategori:</label>
        <input type="text" class="form-control" id="category" name="category" value="{{ aset[4] }}" required>
    </div>

    <div class="form-group">
        <label for="price">Harga Aset:</label>
        <input type="number" class="form-control" id="price" name="price" value="{{ aset[5] }}" required>
    </div>

    <div class="form-group">
        <label for="purchase_date">Tanggal pembelian (YYYY-MM-DD):</label>
        <input type="date" class="form-control" id="purchase_date" name="purchase_date" value="{{ aset[6] }}" required>
    </div>

    <div class="form-group">
        <label for="asset_image">Gambar Aset:</label>
        {% if aset[7] %}
        <img src="{{ url_for('static', filename='uploads/' + aset[7]) }}" alt="Gambar Aset" width="100"><br>
        <small>Current Gambar Aset</small>
        {% endif %}
        <input type="file" class="form-control" name="asset_image" accept="image/*">
    </div>


    <button type="submit" class="btn btn-primary">Update</button>
</form>

{% endblock %}
