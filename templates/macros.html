{% macro action_dropdown(aset_id) %}
<a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">Action</a>
<ul class="dropdown-menu">
    <li><a class="dropdown-item" href="{{ url_for('edit_aset', id=aset_id) }}">Edit</a></li>
    <li><hr class="dropdown-divider"></li>
    <li>
        <form action="{{ url_for('delete_aset', id=aset_id) }}" method="POST" style="display:inline;" onsubmit="return confirmDelete()">
            <button type="submit" class="dropdown-item">Delete</button>
        </form>
    </li>
</ul>
{% endmacro %}
